# Optional Render Blueprint: creates the API and a PostgreSQL database together.
services:
  - type: web
    name: fleet-api
    runtime: node
    rootDir: backend          # remove this line if package.json is at the repo root
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fleet-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false           # set in dashboard, e.g. https://your-frontend.onrender.com
databases:
  - name: fleet-db
    plan: free
